[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "toktok-rs"
description = "Fast, exact BPE tokenizer for OpenAI encodings — Rust core, tiktoken-identical ids"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSE-quicktok-upstream"]
authors = [{ name = "vectorize-io" }]
keywords = ["tokenizer", "bpe", "tiktoken", "cl100k", "o200k", "gpt", "gpt-oss", "harmony"]
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Free Threading :: 3 - Stable",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/vectorize-io/toktok"
Repository = "https://github.com/vectorize-io/toktok"
Issues = "https://github.com/vectorize-io/toktok/issues"

[project.optional-dependencies]
numpy = ["numpy>=1.21"]

[dependency-groups]
# `uv sync` installs these and builds the extension: one command to a working checkout
dev = ["pytest>=7", "tiktoken", "numpy>=1.21", "maturin>=1.7,<2"]
# benchmark-only extras: the corpus fetcher and the C++ tokenizer we compare against
bench = ["datasets", "zstandard", "quicktok-v1"]
# Its own group, not part of `bench`: quicktok-v1 has no wheel past 3.11, and
# sharing a group would mean gigatoken disappearing from the comparison on every
# interpreter quicktok cannot install on. gigatoken publishes a single cp310
# abi3 wheel, which covers 3.11-3.14 but not the free-threaded build.
gigatoken = ["gigatoken"]

[tool.uv]
# Never build these from source: both are large Rust extensions, and a missing
# wheel should be a fast "not available here", not a twenty-minute compile.
no-build-package = ["gigatoken", "quicktok-v1"]

[tool.maturin]
manifest-path = "crates/toktok-py/Cargo.toml"
module-name = "toktok._toktok"
python-source = "python"
features = ["pyo3/extension-module"]
# the vocab tables are compiled into the extension module; the sdist needs
# them as sources so it can rebuild
include = [{ path = "crates/toktok/data/*", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Markdown carries hand-aligned example code; formatting it collapses the
# alignment that makes the docs readable
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import sorting
  "UP",       # pyupgrade — we are 3.11+
  "B",        # bugbear
  "SIM",      # simplify
  "RUF",      # ruff's own
]
ignore = [
  # "ambiguous unicode character": this is a tokenizer. Greek, CJK, fullwidth
  # and combining characters in the fixtures are the point, not a typo.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# benchmarks and tools import optional third-party encoders inside functions on
# purpose, so each subprocess loads only the one it measures
"bench/*" = ["E402", "PLC0415"]
