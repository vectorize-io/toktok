name: Benchmarks

# Benchmarks on a dedicated runner instead of a developer laptop: a busy laptop
# swung the same measurement by 5x, which makes absolute MB/s meaningless. A
# runner is not a quiet lab machine either — it is a shared vCPU — so this job
# still leans on same-run ratios, pins single-threaded work to one core, and
# reports the spread across repeated runs so noise is visible rather than hidden.
#
# Manual only. Benchmarks are slow, and a number measured on a shared runner is
# not worth blocking a merge or a release on — run this when you want to know,
# not on every commit.
on:
  workflow_dispatch:
    inputs:
      corpora:
        description: "Corpora to run (comma separated: pile, code, commoncrawl)"
        default: "pile,code,commoncrawl"
      encodings:
        description: "Encodings (comma separated)"
        default: "cl100k_base,o200k_base"
      runs:
        description: "Repeat the whole matrix N times to show run-to-run spread"
        default: "2"

concurrency:
  # never let two benchmark jobs share a runner
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust encoders
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Record the machine
        run: |
          {
            echo "## Benchmarks"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`${GITHUB_SHA:0:9}\` |"
            echo "| runner | $(uname -sm), $(nproc) vCPU |"
            echo "| cpu | $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs) |"
            echo "| load at start | $(cut -d' ' -f1-3 /proc/loadavg) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # 75 MB of corpora, fetched once and reused. The fetch is deterministic
      # (fixed streaming order, cut at 25 MB), so a cached corpus is byte-identical
      # to a fresh one and results stay comparable across runs.
      - name: Cache corpora
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: bench/corpus
          key: corpus-v1-${{ hashFiles('bench/fetch_corpus.py') }}
      - name: Fetch corpora
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          uv sync --group bench
          uv run python bench/fetch_corpus.py

      - name: toktok vs bpe-openai vs tiktoken-rs
        run: |
          cargo build --release --manifest-path bench/rust/Cargo.toml
          # taskset pins the single-threaded measurement to one core so the
          # scheduler cannot move it between vCPUs mid-run
          for run in $(seq 1 "${RUNS:-2}"); do
            echo "### run $run"
            for c in ${CORPORA//,/ }; do
              for e in ${ENCODINGS//,/ }; do
                taskset -c 0 ./bench/rust/target/release/toktok-bench \
                  "bench/corpus/$c.txt" "$e" || true
              done
            done
          done | tee rust-bench.txt
        env:
          CORPORA: ${{ inputs.corpora || 'pile,code,commoncrawl' }}
          ENCODINGS: ${{ inputs.encodings || 'cl100k_base,o200k_base' }}
          RUNS: ${{ inputs.runs || '2' }}

      - name: Summarize
        if: always()
        run: |
          {
            echo "<details><summary>Rust encoders</summary>"
            echo; echo '```'; cat rust-bench.txt; echo '```'; echo
            echo "</details>"; echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench-rust, path: rust-bench.txt }

  python:
    # One row per interpreter, because they are not interchangeable: the
    # free-threaded build is the whole point of the cp314t wheel and its threaded
    # numbers are what differ, while 3.11 is the oldest we ship and answers "do I
    # need a new Python to get this?".
    name: python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14", "3.14t"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Cache corpora
        id: corpus-cache
        uses: actions/cache@v4
        with:
          path: bench/corpus
          key: corpus-v1-${{ hashFiles('bench/fetch_corpus.py') }}
      - name: Fetch corpora
        if: steps.corpus-cache.outputs.cache-hit != 'true'
        run: |
          uv sync --group bench
          uv run python bench/fetch_corpus.py

      - name: Build
        # the bench group pulls the C++ tokenizer we compare against, which has
        # no wheel for every interpreter — fall back to just the dev deps
        run: |
          uv sync --group bench --no-editable --python ${{ matrix.python }} \
            || uv sync --no-editable --python ${{ matrix.python }}

      - name: Verify exactness before measuring anything
        # tiktoken has no free-threaded wheel yet, so on 3.14t the parity tests
        # skip themselves; the rest of the suite still guards the build
        run: uv run --python ${{ matrix.python }} pytest tests -q

      - name: Throughput vs tiktoken
        run: |
          taskset -c 0 uv run --python ${{ matrix.python }} \
            python bench/compare.py --repeats 5 --corpus "${CORPORA%%,*}" \
            | tee "python-bench-${{ matrix.python }}.txt"
        env:
          CORPORA: ${{ inputs.corpora || 'pile' }}

      - name: Memory, CPU and latency percentiles
        run: |
          uv run --python ${{ matrix.python }} \
            python bench/profile.py --threads "$(nproc)" --corpus "${CORPORA%%,*}" \
            | tee "profile-${{ matrix.python }}.txt"
        env:
          CORPORA: ${{ inputs.corpora || 'pile' }}

      - name: Summarize
        if: always()
        run: |
          for f in python-bench-${{ matrix.python }}.txt profile-${{ matrix.python }}.txt; do
            [ -s "$f" ] || continue
            {
              echo "<details><summary>Python ${{ matrix.python }} — $f</summary>"
              echo; echo '```'; cat "$f"; echo '```'; echo
              echo "</details>"; echo
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-python-${{ matrix.python }}
          path: |
            python-bench-${{ matrix.python }}.txt
            profile-${{ matrix.python }}.txt
