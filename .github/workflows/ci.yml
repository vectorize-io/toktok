name: CI

# Pull requests only. Nothing runs on a push to main: main is only reached
# through a PR that already passed this, so re-running it post-merge tests a
# commit that was tested minutes ago. Releases are the one exception and live
# in release.yml, triggered by a tag you push deliberately.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12" # pyo3 needs an interpreter to build against
      - name: Tests (exactness fixtures, offsets, batch, invalid UTF-8, memory)
        run: cargo test --release
      - name: Lints
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings

  python:
    # Every interpreter we publish wheels for, on every platform we publish for.
    name: python ${{ matrix.python }} ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build the extension from source
        # On 3.14t pyo3's abi3 feature falls back to a version-specific
        # free-threaded build, which is what the cp314t wheel is
        run: uv sync --no-editable --python ${{ matrix.python }}
      - name: Tests (parity vs tiktoken, the Python API, free-threading)
        run: uv run --python ${{ matrix.python }} pytest -q

  wheels:
    name: wheels ${{ matrix.target }}${{ matrix.freethreaded && ' (3.14t)' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
          - { os: ubuntu-latest, target: x86_64, freethreaded: true }
          - { os: ubuntu-latest, target: aarch64, freethreaded: true }
          - { os: macos-latest, target: universal2-apple-darwin, freethreaded: true }
          - { os: windows-latest, target: x64, freethreaded: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: matrix.freethreaded
        with:
          python-version: "3.14t"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist ${{ matrix.freethreaded && '--interpreter 3.14t' || '' }}
          manylinux: ${{ matrix.freethreaded && '2_28' || 'auto' }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}${{ matrix.freethreaded && '-ft' || '' }}
          path: dist

  wheel-smoke:
    # The matrix above builds from source. This installs the *shipped artifact*
    # — one abi3 wheel serving 3.11-3.14, plus the cp314t wheel — and checks it
    # loads and tokenizes on each interpreter, which is what users actually get.
    name: wheel install ${{ matrix.os }}
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, abi3: wheels-ubuntu-latest-x86_64, ft: wheels-ubuntu-latest-x86_64-ft }
          - { os: macos-latest, abi3: wheels-macos-latest-universal2-apple-darwin, ft: wheels-macos-latest-universal2-apple-darwin-ft }
          - { os: windows-latest, abi3: wheels-windows-latest-x64, ft: wheels-windows-latest-x64-ft }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with: { name: "${{ matrix.abi3 }}", path: dist }
      - uses: actions/download-artifact@v4
        with: { name: "${{ matrix.ft }}", path: dist }
      - name: Install the wheel on every interpreter it claims to support
        shell: bash
        run: |
          set -euo pipefail
          abi3=$(ls dist/*abi3*.whl)
          ft=$(ls dist/*cp314t*.whl)
          echo "abi3 wheel: $abi3"
          echo "free-threaded wheel: $ft"
          for v in 3.11 3.12 3.13 3.14; do
            echo "::group::abi3 wheel on python $v"
            uv run --no-project --python "$v" --with "$abi3" python tools/smoke.py
            echo "::endgroup::"
          done
          echo "::group::free-threaded wheel on python 3.14t"
          uv run --no-project --python 3.14t --with "$ft" python tools/smoke.py
          echo "::endgroup::"

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: astral-sh/setup-uv@v5
      - name: The sdist must build and work
        run: uv run --no-project --with dist/*.tar.gz python tools/smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist
