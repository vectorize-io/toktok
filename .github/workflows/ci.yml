name: CI

# Tests and wheel builds. Publishing lives in release.yml (tag-driven).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          # every supported interpreter, including the free-threaded build
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.14t" }
          - { os: macos-latest, python: "3.14t" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Rust tests (exactness fixtures, offsets, batch, invalid UTF-8)
        run: cargo test --release
      - name: Build and install the extension
        # uv drives the maturin PEP 517 backend, which compiles the Rust cdylib.
        # On 3.14t pyo3's abi3 feature falls back to a version-specific
        # free-threaded build, which is what we want.
        run: uv sync --no-editable --python ${{ matrix.python }}
      - name: Python tests (parity vs tiktoken, free-threading)
        run: uv run --python ${{ matrix.python }} pytest -q

  wheels:
    name: wheels ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # One abi3 wheel per platform covers CPython 3.11 through 3.14 (and later)
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-abi3-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  wheels-freethreaded:
    # abi3 does not exist for free-threaded CPython, so these are version-specific.
    # 3.14t is the floor: pyo3 rejects the free-threaded build below 3.14.
    name: wheels free-threaded ${{ matrix.target }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64 }
          - { os: ubuntu-latest, target: aarch64 }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14t"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --interpreter 3.14t
          manylinux: 2_28 # the older images have no free-threaded interpreter
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-ft-${{ matrix.os }}-${{ matrix.target }}
          path: dist

  sdist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist
